[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milp_visualizer"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.17",
    "matplotlib>=3.10",
    "plotly>=6.0",
    "csrgraph>=0.1.28",
    "nodevectors>=0.2.0",
    "umap-learn>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["milp_visualizer*"]
